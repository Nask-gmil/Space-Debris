<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Debris - Three.js</title>
  <script type="module" crossorigin src="./assets/index-_5sBrN8i.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Cdnl-8y1.css">
</head>
<body>
    <div class="app">
        <div class="archive-open-buttons">
            <button type="button" class="encyclopedia-open-button" id="encyclopediaOpenButton" aria-haspopup="dialog" aria-controls="encyclopediaOverlay">
                📖 図鑑
            </button>
            <button type="button" class="achievements-open-button" id="achievementsOpenButton" aria-haspopup="dialog" aria-controls="encyclopediaOverlay">
                🏆 実績
            </button>
            <button type="button" class="statistics-open-button" id="statisticsOpenButton" aria-haspopup="dialog" aria-controls="encyclopediaOverlay">
                📊 統計
            </button>
        </div>
        <aside class="input-panel" id="inputPanel" aria-label="食べ物登録フォーム">
            <button type="button" class="panel-handle" id="inputPanelHandle" aria-expanded="false" aria-controls="inputPanelBody">
                <span class="panel-handle-label">＋ 食べ物を登録</span>
                <span class="panel-handle-icon" aria-hidden="true">▽</span>
            </button>
            <div class="panel-body" id="inputPanelBody">
                <h1>食べ物登録</h1>
                <form class="food-form">
                    <label for="genreSelect">登録済みジャンル</label>
                    <select id="genreSelect" name="genreSelect">
                        <option value="new" selected>＋ 新ジャンルを登録</option>
                    </select>

                    <label for="genreInput">ジャンル</label>
                    <input id="genreInput" name="genreInput" type="text" placeholder="例: ラーメン">

                    <label for="storeName">店名(任意)</label>
                    <input id="storeName" name="storeName" type="text" placeholder="例: すき家 / ラーメン二郎">

                    <label for="foodName">食べ物名</label>
                    <input id="foodName" name="foodName" type="text" placeholder="例: 味噌ラーメン">

                    <label for="calories">カロリー(kcal)</label>
                    <input id="calories" name="calories" type="number" min="0" placeholder="例: 500">

                    <button type="button">登録</button>
                    <p id="errorMessage" class="error-message" aria-live="polite"></p>
                </form>

                <div class="danger-zone">
                    <button type="button" id="supernovaButton" class="supernova-button">☄️ 超新星爆発(全データ削除)</button>
                </div>
            </div>
        </aside>
        <canvas id="canvas"></canvas>
        <aside class="info-panel" id="infoPanel" aria-label="星の詳細">
            <button type="button" class="panel-handle info-panel-handle" id="infoPanelHandle" aria-expanded="false" aria-controls="infoPanelBody">
                <span class="info-summary" id="infoSummary">
                    <span class="info-summary-placeholder">星を選択してください</span>
                </span>
                <span class="panel-handle-icon" aria-hidden="true">△</span>
            </button>
            <div class="panel-body" id="infoPanelBody">星を選択してください</div>
        </aside>
        <section class="encyclopedia-overlay" id="encyclopediaOverlay" role="dialog" aria-modal="true" aria-labelledby="encyclopediaTitle" aria-hidden="true" inert>
            <div class="encyclopedia-shell">
                <header class="encyclopedia-header">
                    <div class="encyclopedia-brand">
                        <span class="encyclopedia-logo" aria-hidden="true">✦</span>
                        <div>
                            <span class="encyclopedia-eyebrow">COSMIC ARCHIVE</span>
                            <h1 id="encyclopediaTitle">宇宙データベース</h1>
                        </div>
                    </div>
                    <nav class="encyclopedia-tabs" aria-label="図鑑メニュー">
                        <button type="button" class="encyclopedia-tab is-active" data-archive-view="encyclopedia" aria-current="page">✧ 図鑑</button>
                        <button type="button" class="encyclopedia-tab" data-archive-view="achievements">♧ 実績</button>
                        <button type="button" class="encyclopedia-tab" data-archive-view="statistics">◷ 統計</button>
                    </nav>
                    <button type="button" class="encyclopedia-close-button" id="encyclopediaCloseButton" aria-label="図鑑を閉じる">×</button>
                </header>
                <div class="encyclopedia-content">
                    <aside class="encyclopedia-sidebar" aria-label="天体一覧">
                        <section class="encyclopedia-card encyclopedia-list-card">
                            <div class="encyclopedia-card-heading">
                                <h2>天体一覧</h2>
                                <span class="encyclopedia-count" id="celestialBodyCount" aria-live="polite"></span>
                            </div>
                            <label class="encyclopedia-search-label" for="celestialBodySearch">天体名で検索</label>
                            <input class="encyclopedia-search" id="celestialBodySearch" type="search" placeholder="日本語名・英語名で検索" autocomplete="off">
                            <label class="encyclopedia-category-label" for="celestialBodyCategory">カテゴリ</label>
                            <select class="encyclopedia-category" id="celestialBodyCategory">
                                <option value="all">すべての天体</option>
                                <option value="planet">惑星</option>
                                <option value="satellite">衛星</option>
                                <option value="star">恒星</option>
                                <option value="dwarf-planet">準惑星</option>
                            </select>
                            <div class="encyclopedia-body-list" id="celestialBodyList" role="listbox" aria-label="天体一覧"></div>
                        </section>
                    </aside>
                    <section class="encyclopedia-card encyclopedia-detail-panel" id="celestialBodyDetails" aria-live="polite" aria-label="選択した天体の詳細情報"></section>
                </div>
                <main class="achievement-content" id="achievementView" aria-label="実績" hidden>
                    <div class="achievement-toolbar">
                        <div class="achievement-filters" aria-label="実績の絞り込み">
                            <button type="button" class="achievement-filter" id="unearnedAchievementsButton" aria-pressed="false">未取得</button>
                            <button type="button" class="achievement-filter" id="earnedAchievementsButton" aria-pressed="false">取得済</button>
                        </div>
                        <span class="achievement-count" id="achievementCount" aria-live="polite">全実績 10件</span>
                    </div>
                    <section class="achievement-list-panel">
                        <header class="achievement-list-heading">
                            <h2>実績一覧</h2>
                            <span>アイコンを選択すると詳細を表示</span>
                        </header>
                        <div class="achievement-grid" id="achievementGrid" aria-label="実績一覧"></div>
                    </section>
                    <p class="achievement-note">※ 未取得の実績は、内容の一部が隠されています。実績を獲得すると詳細が解放されます。</p>
                </main>
                <main class="statistics-content" id="statisticsView" aria-label="統計" hidden>
                    <section class="statistics-summary" aria-label="生涯統計">
                        <article class="statistics-card">
                            <span class="statistics-icon" aria-hidden="true">🔥</span>
                            <div class="statistics-card-copy">
                                <h2>累計カロリー</h2>
                                <p id="lifetimeCaloriesValue" aria-live="polite">0 kcal</p>
                            </div>
                        </article>
                        <article class="statistics-card">
                            <span class="statistics-icon" aria-hidden="true">🍽️</span>
                            <div class="statistics-card-copy">
                                <h2>食事登録数</h2>
                                <p id="lifetimeRegistrationCountValue" aria-live="polite">0 件</p>
                            </div>
                        </article>
                        <article class="statistics-card">
                            <span class="statistics-icon" aria-hidden="true">🌌</span>
                            <div class="statistics-card-copy">
                                <h2>育成天体数</h2>
                                <p id="lifetimeCelestialBodyCountValue" aria-live="polite">0 個</p>
                            </div>
                        </article>
                        <article class="statistics-card">
                            <span class="statistics-icon" aria-hidden="true">📅</span>
                            <div class="statistics-card-copy">
                                <h2>記録した日数</h2>
                                <p id="recordedDaysValue" aria-live="polite">0 日</p>
                            </div>
                        </article>
                    </section>
                    <div class="statistics-detail-layout">
                        <section class="statistics-chart-panel" aria-labelledby="calorieTrendHeading">
                            <header class="statistics-chart-header">
                                <div>
                                    <h2 id="calorieTrendHeading">カロリー推移</h2>
                                    <p>日ごとの摂取カロリー</p>
                                </div>
                                <div class="statistics-chart-controls">
                                    <div class="statistics-view-switch" role="group" aria-label="統計表示">
                                        <button type="button" class="statistics-view-button is-active" data-statistics-display="chart" aria-pressed="true">グラフ</button>
                                        <button type="button" class="statistics-view-button" data-statistics-display="calendar" aria-pressed="false">カレンダー</button>
                                    </div>
                                    <div class="statistics-period-switch" id="calorieTrendPeriods" role="group" aria-label="グラフの期間">
                                        <button type="button" class="statistics-period-button is-active" data-calorie-period="7d" aria-pressed="true">7日</button>
                                        <button type="button" class="statistics-period-button" data-calorie-period="30d" aria-pressed="false">30日</button>
                                        <button type="button" class="statistics-period-button" data-calorie-period="1y" aria-pressed="false">1年</button>
                                    </div>
                                </div>
                            </header>
                            <div class="statistics-chart-wrap statistics-chart-view" id="calorieTrendView">
                                <svg id="calorieTrendChart" role="img" aria-label="日別カロリー推移グラフ"></svg>
                            </div>
                            <section class="meal-calendar-view" id="mealCalendarView" aria-label="食事カレンダー" hidden>
                                <div class="meal-calendar-layout">
                                    <section class="meal-calendar">
                                        <header class="meal-calendar-header">
                                            <div class="meal-calendar-month-controls">
                                                <button type="button" class="meal-calendar-nav-button" id="mealCalendarPreviousMonth" aria-label="前月">‹</button>
                                                <h3 id="mealCalendarMonthLabel" aria-live="polite"></h3>
                                                <button type="button" class="meal-calendar-nav-button" id="mealCalendarNextMonth" aria-label="翌月">›</button>
                                            </div>
                                            <button type="button" class="meal-calendar-today-button" id="mealCalendarTodayButton">今月</button>
                                        </header>
                                        <div class="meal-calendar-weekdays" aria-hidden="true">
                                            <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
                                        </div>
                                        <div class="meal-calendar-days" id="mealCalendarDays" role="group" aria-label="日付を選択"></div>
                                    </section>
                                    <section class="meal-day-details" aria-label="選択した日の食事履歴" aria-live="polite">
                                        <header class="meal-day-details-header">
                                            <h3 id="selectedMealDate">日付を選択してください</h3>
                                            <p id="selectedMealTotal"></p>
                                        </header>
                                        <p class="meal-calendar-empty" id="mealCalendarEmpty" hidden>この日の食事記録はありません。</p>
                                        <ul class="meal-calendar-food-list" id="mealCalendarFoodList" hidden></ul>
                                    </section>
                                </div>
                            </section>
                        </section>
                    </div>
                </main>
                <section class="achievement-detail-overlay" id="achievementDetailOverlay" role="dialog" aria-modal="true" aria-labelledby="achievementDetailHeading" aria-hidden="true" inert>
                    <article class="achievement-detail-card">
                        <header class="achievement-detail-header">
                            <h2 class="achievement-detail-heading" id="achievementDetailHeading">実績の詳細</h2>
                            <button type="button" class="achievement-detail-close" id="achievementDetailCloseButton" aria-label="詳細を閉じる">×</button>
                        </header>
                        <div class="achievement-detail-content" id="achievementDetailContent"></div>
                    </article>
                </section>
            </div>
        </section>
        <div class="drawer-backdrop" id="drawerBackdrop"></div>
        <div class="supernova-flash" id="supernovaFlash" aria-hidden="true"></div>
        <div class="supernova-message" id="supernovaMessage" aria-hidden="true"></div>
    </div>
</body>
</html>
